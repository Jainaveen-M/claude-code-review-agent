<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Review Agent</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/new">
      <img src="/favicon.svg" alt="" width="24" height="24">
      <span class="brand-text">Code Review Agent</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/new" data-nav="new">New review</a>
      <a href="#/history" data-nav="history">History</a>
    </nav>
    <div class="topbar-right">
      <span id="session-pill" class="pill session"></span>
      <span id="model-pill" class="pill mono" title="Model used for reviews"></span>
      <div id="theme-toggle" class="theme-toggle" role="group" aria-label="Colour theme"></div>
      <button id="settings-btn" class="btn ghost small" type="button" aria-label="Settings"><span class="btn-text">Settings</span></button>
    </div>
  </header>

  <main>
    <div id="banner" class="banner" role="status" hidden></div>
    <div id="view"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="folder-dialog" class="dialog wide" aria-labelledby="folder-title">
    <form method="dialog" class="dialog-head">
      <h3 id="folder-title">Choose a project folder</h3>
      <button class="btn ghost" value="close">Close</button>
    </form>
    <div class="dialog-body folder-body">
      <div class="folder-shortcuts" id="folder-shortcuts"></div>
      <div class="folder-nav">
        <button type="button" class="btn small" id="folder-up" title="Parent folder">↑ Up</button>
        <nav class="crumbs" id="folder-crumbs" aria-label="Current folder"></nav>
      </div>
      <div class="folder-tools">
        <input type="search" id="folder-filter" placeholder="Filter folders" aria-label="Filter folders">
        <label class="check"><input type="checkbox" id="folder-hidden"> Show hidden</label>
        <button type="button" class="btn small" id="folder-scan">Find git repos here</button>
      </div>
      <p class="hint" id="folder-note"></p>
      <ul class="folder-list" id="folder-list" aria-live="polite"></ul>
    </div>
    <div class="dialog-foot folder-foot">
      <span class="hint" id="folder-current"></span>
      <button type="button" class="btn primary" id="folder-select" disabled>Use this folder</button>
    </div>
  </dialog>

  <dialog id="settings-dialog" class="dialog">
    <form id="settings-form" method="dialog">
      <div class="dialog-head"><h3>Settings</h3></div>
      <div class="dialog-body form-stack">
        <label>Model
          <select id="cfg-model"></select>
          <span class="hint">Models available depend on your Claude plan.</span>
        </label>
        <label>Effort
          <select id="cfg-effort"></select>
          <span class="hint">Higher effort reviews more thoroughly and uses more of your plan.</span>
        </label>
        <label>Stop a review above this estimated cost (USD)
          <input id="cfg-budget" type="number" min="0.1" step="0.1" placeholder="No limit">
          <span class="hint">Uses Claude Code's API-equivalent estimate, to keep long reviews from eating into your plan's usage limits.</span>
        </label>
        <p class="hint">Reports are saved in <code>~/code-reviews</code> (or <code>$CODE_REVIEW_AGENT_HOME</code>).</p>
        <p class="error" id="settings-error" role="alert"></p>
      </div>
      <div class="dialog-foot">
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" id="settings-save" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="dialog">
    <form method="dialog">
      <div class="dialog-head"><h3 id="confirm-title">Are you sure?</h3></div>
      <div class="dialog-body"><p id="confirm-text"></p></div>
      <div class="dialog-foot">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn danger" value="confirm" id="confirm-ok">Delete</button>
      </div>
    </form>
  </dialog>
</body>
</html>
